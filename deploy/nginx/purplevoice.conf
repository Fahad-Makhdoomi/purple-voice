# Purple Voice — nginx site config.
# Install: sudo cp deploy/nginx/purplevoice.conf /etc/nginx/sites-available/purplevoice
#          sudo ln -s /etc/nginx/sites-available/purplevoice /etc/nginx/sites-enabled/
#          replace purplevoice.ai with your domain, then: sudo nginx -t && sudo systemctl reload nginx
#
# Routing:  /api/*      → Express API   (127.0.0.1:4000)
#           /ws/*       → API media WebSockets (Twilio / Plivo audio streams)
#           /uploads/*  → files on disk (uploaded media, immutable)
#           everything else → Next.js   (127.0.0.1:3000)

limit_req_zone $binary_remote_addr zone=pv_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pv_api:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pv_web { server 127.0.0.1:3000; keepalive 32; }
upstream pv_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name purplevoice.ai www.purplevoice.ai;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://purplevoice.ai$request_uri; }
}

server {
    # `listen … http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.purplevoice.ai;
    ssl_certificate     /etc/letsencrypt/live/purplevoice.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purplevoice.ai/privkey.pem;
    return 301 https://purplevoice.ai$request_uri;
}

server {
    # `listen … http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name purplevoice.ai;

    ssl_certificate     /etc/letsencrypt/live/purplevoice.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purplevoice.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Sign-in, sign-up and password reset: slow down credential stuffing at the edge too.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=pv_auth burst=10 nodelay;
        proxy_pass http://pv_api;
    }

    # AI assistant streams Server-Sent Events: never buffer.
    location = /api/app/support/assistant {
        proxy_pass http://pv_api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=pv_api burst=60 nodelay;
        proxy_pass http://pv_api;
        proxy_read_timeout 60s;
    }

    # Live call audio. Calls can last up to an hour.
    location /ws/ {
        proxy_pass http://pv_api;
        # A location-level proxy_set_header replaces all inherited ones, so repeat them.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
    }

    # Uploaded media: content-hashed file names, so cache for a year.
    location /uploads/ {
        alias /var/www/purple-voice/storage/uploads/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Next.js build assets are fingerprinted.
    location /_next/static/ {
        proxy_pass http://pv_web;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The revalidation hook is called by the API over localhost, never from outside.
    location /internal/ { return 404; }

    location / {
        proxy_pass http://pv_web;
    }
}
