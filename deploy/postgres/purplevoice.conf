# PostgreSQL 16 tuning for a KVM 2 VPS (4 GB RAM, 2 vCPU) shared with Node.js.
# Install: sudo cp deploy/postgres/purplevoice.conf /etc/postgresql/16/main/conf.d/
#          sudo systemctl restart postgresql
#
# Budget: ~1 GB Postgres shared memory, ~1.5 GB for Node (web + api + worker),
# the rest for the OS page cache (which Postgres also benefits from).

listen_addresses = 'localhost'
max_connections = 60                  # Prisma pools: api 10 + worker 5 + headroom

shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 8MB
maintenance_work_mem = 256MB
huge_pages = off

wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9

random_page_cost = 1.1                # SSD / NVMe
effective_io_concurrency = 200
default_statistics_target = 100

max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

log_min_duration_statement = 500ms    # log slow queries
log_checkpoints = on
log_lock_waits = on
