# Purple Voice — additions to the CloudPanel vhost.
# setup.sh writes this file with your ports filled in to ~/purple-voice-vhost.conf.
#
# CloudPanel → Sites → <your domain> → Vhost:
#   1. Paste PART 1 at the very top of the editor, above the first `server {`.
#   2. Inside the server block, delete CloudPanel's `location / { … }` block and
#      paste PART 2 in its place. Keep everything else CloudPanel generated
#      (listen, ssl, server_name, root, logs, the .well-known block).
#   3. Save. CloudPanel tests the configuration before reloading nginx.
#
# Routing:  /api/*      → Express API (live-call webhooks, dashboard, admin)
#           /ws/*       → API media WebSockets (Twilio / Plivo call audio)
#           /uploads/*  → uploaded media on disk (this site's htdocs/uploads)
#           /internal/* → blocked (revalidation hook, called over localhost only)
#           everything else → Next.js


# ===== PART 1 — above `server {` =============================================

limit_req_zone $binary_remote_addr zone=pv_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pv_api:10m rate=30r/s;

map $http_upgrade $pv_connection_upgrade {
    default upgrade;
    ''      close;
}

# Ports: web = PORT in web.env; API = API_PORT in api.env (setup.sh fills these in).
upstream pv_web { server 127.0.0.1:__WEB_PORT__; keepalive 32; }
upstream pv_api { server 127.0.0.1:__API_PORT__; keepalive 32; }


# ===== PART 2 — inside `server { … }`, replacing `location / { … }` ==========

  # Uploaded media, written by the API into htdocs/<domain>/uploads.
  # Content-hashed file names, so they can be cached for a year.
  location ^~ /uploads/ {
    try_files $uri =404;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # The revalidation hook is called by the API over localhost, never from outside.
  location ^~ /internal/ {
    return 404;
  }

  location ^~ /api/ {
    limit_req zone=pv_api burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 12m;
    proxy_pass http://pv_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Sign-in, sign-up and password reset: slow down credential stuffing at the edge too.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password)$ {
      limit_req zone=pv_auth burst=10 nodelay;
      proxy_pass http://pv_api;
    }

    # The AI support assistant streams Server-Sent Events: never buffer.
    location = /api/app/support/assistant {
      proxy_pass http://pv_api;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }

  # Live call audio. Calls can last up to an hour.
  location ^~ /ws/ {
    proxy_pass http://pv_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pv_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://pv_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
